# ── HTTP → HTTPS 리다이렉트 ─────────────────────────
server {
  listen 80;
  server_name test.xetead.quest;
  return 301 https://$host$request_uri;
}

# ── 테스트 인스턴스 ─────────────────────────────────
server {
  listen 443 ssl http2;
  server_name test.xetead.quest;

  resolver 127.0.0.11 valid=30s;
  set $web_test web_test:3001;
  set $streaming_test streaming_test:4001;

  ssl_certificate     /etc/nginx/certs/origin.pem;   # 동일한 와일드카드 인증서
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  keepalive_timeout 70;
  sendfile on;
  client_max_body_size 99m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy "";
    proxy_pass http://$web_test;
    proxy_buffering on;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    tcp_nodelay on;
  }

  location ^~ /api/v1/streaming {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$streaming_test;
    proxy_buffering off;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    tcp_nodelay on;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
