services:
  # ── 본 인스턴스 ─────────────────────────────────
  db:
    image: postgres:14-alpine
    restart: always
    env_file: .env.mastodon
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: mastodon
      POSTGRES_DB: mastodon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks: [internal]

  web:
    build: .
    restart: always
    env_file: .env.mastodon
    command: bundle exec puma -C config/puma.rb
    user: '991:991'
    depends_on: [db, redis, search]
    networks: [internal, external]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider --proxy=off localhost:3000/health || exit 1',
        ]

  streaming:
    build:
      context: .
      dockerfile: ./streaming/Dockerfile
    restart: always
    env_file: .env.mastodon
    command: node ./streaming/index.js
    depends_on: [db, redis]
    networks: [internal, external]

  sidekiq:
    build: .
    restart: always
    env_file: .env.mastodon
    command: bundle exec sidekiq
    user: '991:991'
    depends_on: [db, redis, search]
    networks: [internal, external]
    volumes:
      - mastodon_system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]

  search:
    build: ./search
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - search_data:/usr/share/elasticsearch/data
    networks: [internal]

  # ── 공통 ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [web]
    networks: [external]

  bot:
    build: /home/xetead/xetead-bot
    restart: always
    env_file: .env.mastodon
    environment:
      # web:3000 직접 호출은 HostAuthorization 미들웨어가 Host: web:3000을
      # 허용 도메인이 아니라고 403으로 막는다(bot_test와 동일 사유). 공개
      # 도메인(Cloudflare 경유, 그 뒤가 이 nginx로 돌아옴)으로 붙여야 한다.
      MASTODON_API_BASE_URL: https://xetead.quest
      # 컨테이너 기본 시간대는 UTC라 date.today() 기준 일일 의뢰 리셋 등이
      # KST 자정이 아닌 UTC 자정(=KST 오전 9시)에 일어난다. 로그 타임스탬프도
      # KST로 찍히길 원해 컨테이너 시간대 자체를 바꾼다.
      TZ: Asia/Seoul
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "bot.main"]
    depends_on: [web]
    # Google Sheets(oauth2.googleapis.com)와 공개 도메인 접근에 외부 인터넷이 필요해 external도 추가.
    networks: [internal, external]

volumes:
  postgres_data:
  redis_data:
  mastodon_system:
  search_data:

networks:
  internal:
    internal: true # 외부 인터넷 차단
  external:
