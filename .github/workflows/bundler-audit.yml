name: Bundler Audit
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
    paths:
      - 'Gemfile*'
      - '.ruby-version'
      - '.github/workflows/bundler-audit.yml'

  pull_request:
    paths:
      - 'Gemfile*'
      - '.ruby-version'
      - '.github/workflows/bundler-audit.yml'

  schedule:
    - cron: '0 5 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUNDLE_ONLY: development

    steps:
      - name: Clone repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          bundler-cache: true

      - name: Run bundler-audit
        # CVE-2026-38969 (webrick, pulled in transitively by prometheus_exporter)
        # has no patched release yet per ruby-advisory-db ("remove or disable
        # this gem until a patch is available"). prometheus_exporter backs
        # Puma/Sidekiq metrics collection here, so it isn't being dropped for
        # this. Revisit and drop this --ignore once webrick ships a fix.
        run: bin/bundler-audit check --update --ignore CVE-2026-38969
